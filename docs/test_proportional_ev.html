<!DOCTYPE html>
<html>
<head>
    <title>Test Proportional EV Algorithm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-case { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; }
        .pass { background-color: #d4edda; }
        .fail { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>Proportional EV Algorithm Test</h1>
    <div id="results"></div>

    <script>
        // Copy the proportional EV allocation function from tester.js
        function allocateProportionalEVs(dVotes, rVotes, oVotes, totalEVs, topThirdPartyShare) {
            const total = dVotes + rVotes + oVotes;
            if (total <= 0 || totalEVs <= 0) return { D: 0, R: 0, O: 0 };
            
            // Calculate exact proportional shares
            const dShare = dVotes / total;
            const rShare = rVotes / total;
            const oShare = oVotes / total;
            
            // Calculate integer portions (quotas)
            const dQuota = Math.floor(dShare * totalEVs);
            const rQuota = Math.floor(rShare * totalEVs);
            const oQuota = Math.floor(oShare * totalEVs);
            
            let allocated = { D: dQuota, R: rQuota, O: oQuota };
            let remaining = totalEVs - (dQuota + rQuota + oQuota);
            
            // Allocate remaining EVs using largest remainder method
            if (remaining > 0) {
                const remainders = [
                    { party: 'D', remainder: (dShare * totalEVs) - dQuota },
                    { party: 'R', remainder: (rShare * totalEVs) - rQuota },
                    { party: 'O', remainder: (oShare * totalEVs) - oQuota }
                ];
                
                // Sort by remainder descending
                remainders.sort((a, b) => b.remainder - a.remainder);
                
                // Allocate remaining EVs to parties with largest remainders
                for (let i = 0; i < remaining; i++) {
                    allocated[remainders[i].party]++;
                }
            }
            
            return allocated;
        }

        function runTest(name, dVotes, rVotes, oVotes, totalEVs, expected) {
            const result = allocateProportionalEVs(dVotes, rVotes, oVotes, totalEVs, 0);
            const pass = result.D === expected.D && result.R === expected.R && result.O === expected.O;
            
            return {
                name,
                pass,
                input: `D:${dVotes}, R:${rVotes}, O:${oVotes}, EVs:${totalEVs}`,
                expected: `D:${expected.D}, R:${expected.R}, O:${expected.O}`,
                actual: `D:${result.D}, R:${result.R}, O:${result.O}`
            };
        }

        // Test cases
        const tests = [
            // Simple 50-50 split with even EVs
            runTest("50-50 split, 10 EVs", 100, 100, 0, 10, { D: 5, R: 5, O: 0 }),
            
            // 60-40 split with 10 EVs  
            runTest("60-40 split, 10 EVs", 600, 400, 0, 10, { D: 6, R: 4, O: 0 }),
            
            // Third party scenario
            runTest("With third party", 450, 350, 200, 10, { D: 5, R: 4, O: 2 }),
            
            // California-like scenario (2020 results: D ~11M, R ~6M, O ~300K)
            runTest("California 2020-like", 11000000, 6000000, 300000, 54, { D: 34, R: 19, O: 1 }),
            
            // Texas-like scenario (2020 results: R ~5.9M, D ~5.3M, O ~160K)  
            runTest("Texas 2020-like", 5300000, 5900000, 160000, 40, { D: 19, R: 21, O: 0 }),
            
            // Close race with odd EVs
            runTest("Close race, 3 EVs", 501, 499, 0, 3, { D: 2, R: 1, O: 0 }),
            
            // Edge case: no votes
            runTest("No votes", 0, 0, 0, 5, { D: 0, R: 0, O: 0 }),
            
            // Edge case: single EV
            runTest("Single EV", 60, 40, 0, 1, { D: 1, R: 0, O: 0 })
        ];

        // Display results
        const resultsDiv = document.getElementById('results');
        let passCount = 0;
        
        tests.forEach(test => {
            const div = document.createElement('div');
            div.className = `test-case ${test.pass ? 'pass' : 'fail'}`;
            div.innerHTML = `
                <h3>${test.name} ${test.pass ? '✓' : '✗'}</h3>
                <p><strong>Input:</strong> ${test.input}</p>
                <p><strong>Expected:</strong> ${test.expected}</p>
                <p><strong>Actual:</strong> ${test.actual}</p>
            `;
            resultsDiv.appendChild(div);
            
            if (test.pass) passCount++;
        });

        // Summary
        const summary = document.createElement('div');
        summary.style.marginTop = '20px';
        summary.style.fontWeight = 'bold';
        summary.innerHTML = `Tests passed: ${passCount}/${tests.length}`;
        resultsDiv.appendChild(summary);
    </script>
</body>
</html>
